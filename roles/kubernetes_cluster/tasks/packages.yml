---
- name: Add Docker CE repository (provides containerd.io)
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: "https://download.docker.com/linux/rhel/$releasever/$basearch/stable"
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/rhel/gpg
  when: k8s_manage_docker_repo | bool

- name: Add Kubernetes repository
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes v{{ kubernetes_minor }}
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/rpm/"
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/rpm/repodata/repomd.xml.key"
    # empêche un "dnf update" de monter kubelet/kubeadm par accident
    exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni

# Une seule transaction dnf pour tout (plus rapide qu'un appel par groupe).
# cri-tools est aligné sur la version mineure de Kubernetes : un crictl
# d'une autre version (ou d'un autre dépôt) segfaultait au preflight kubeadm.
- name: Install container runtime and Kubernetes packages
  ansible.builtin.dnf:
    name:
      - "containerd.io-{{ containerd_version }}"
      - "cri-tools-{{ kubernetes_minor }}*"
      - "kubeadm-{{ kubernetes_version }}"
      - "kubelet-{{ kubernetes_version }}"
      - "kubectl-{{ kubernetes_version }}"
    state: present
    allow_downgrade: true
    disable_excludes: kubernetes

- name: Remove stray crictl binaries that would shadow the packaged one
  ansible.builtin.file:
    path: /usr/local/bin/crictl
    state: absent

# ---------------------------------------------------------------------------
# Intégrité : un dnf interrompu (Ctrl+C, VM coupée) laisse des fichiers vides
# ou tronqués => "Exec format error", segfault de crictl, kubelet "masqué".
# rpm -V compare chaque fichier à l'empreinte du paquet ; on réinstalle les
# paquets dont un fichier (hors config) est manquant ou modifié.
# ---------------------------------------------------------------------------
- name: Verify integrity of installed Kubernetes packages
  ansible.builtin.command: "rpm -V {{ item }}"  # noqa: command-instead-of-module
  loop: "{{ k8s_verified_packages }}"
  register: kc_rpm_verify
  changed_when: false
  failed_when: false
  check_mode: false

- name: Reinstall corrupted packages
  ansible.builtin.command: "dnf -y reinstall {{ kc_corrupted_pkgs | join(' ') }} --disableexcludes=kubernetes"  # noqa: command-instead-of-module
  vars:
    kc_corrupted_pkgs: >-
      {%- set bad = [] -%}
      {%- for r in kc_rpm_verify.results -%}
        {%- if r.stdout_lines | select('match', '^(missing|\\S*5\\S*)\\s+/') | list | length > 0 -%}
          {%- set _ = bad.append(r.item) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ bad }}
  when: kc_corrupted_pkgs | length > 0
  changed_when: true
  notify: Reload systemd   # exécuté au flush_handlers de containerd.yml, avant kubelet

- name: Smoke-test Kubernetes binaries
  ansible.builtin.command: "{{ item }}"
  loop:
    - kubeadm version -o short
    - kubelet --version
    - kubectl version --client
    - crictl --version
  changed_when: false
  check_mode: false
