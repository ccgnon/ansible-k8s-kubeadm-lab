---
# Réinitialisation ciblée de workers abîmés, puis rejoin automatique.
# Usage : ansible-playbook k8s_cluster.yml -e k8s_reset_nodes=redhat-vm2
# (plusieurs nœuds : -e k8s_reset_nodes=redhat-vm2,redhat-vm3)
- name: Reset selected worker nodes
  when: inventory_hostname in kc_reset_list
  vars:
    kc_reset_list: >-
      {{ (k8s_reset_nodes.split(',') if k8s_reset_nodes is string else k8s_reset_nodes)
         | map('trim') | list }}
  block:
    - name: Refuse to reset the control-plane
      ansible.builtin.assert:
        that: inventory_hostname not in groups[k8s_master_group]
        fail_msg: "Le control-plane ne peut pas être réinitialisé avec k8s_reset_nodes."
        quiet: true

    - name: Show node state before reset (diagnostic)
      ansible.builtin.shell: |
        set +e -o pipefail
        echo "== disk";  df -h / /var | tail -n +2
        echo "== cni";   ls -l /etc/cni/net.d /opt/cni/bin 2>&1 | head -20
        echo "== install-cni"
        crictl ps -a --name install-cni -q | head -1 | xargs -r crictl logs --tail 15 2>&1
      args:
        executable: /bin/bash
      register: kc_reset_diag
      changed_when: false

    - name: Display node state before reset
      ansible.builtin.debug:
        var: kc_reset_diag.stdout_lines

    - name: Remove node from the cluster
      ansible.builtin.command: "kubectl delete node {{ inventory_hostname }} --ignore-not-found"
      environment: "{{ k8s_admin_env }}"
      delegate_to: "{{ k8s_master_host }}"
      changed_when: true

    - name: Run kubeadm reset
      ansible.builtin.command: "kubeadm reset -f --cri-socket={{ k8s_cri_socket }}"
      changed_when: true

    - name: Remove CNI and Calico local state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /var/lib/calico
        - /var/run/calico
        - /var/lib/cni

    - name: Recreate CNI configuration directory
      ansible.builtin.file:
        path: /etc/cni/net.d
        state: directory
        mode: "0755"

    - name: Flush iptables rules left by kube-proxy and Calico
      ansible.builtin.shell: |
        set -e
        for t in filter nat mangle raw; do iptables -t "$t" -F; iptables -t "$t" -X; done
      args:
        executable: /bin/bash
      changed_when: true

    - name: Remove Calico network interfaces
      ansible.builtin.shell: |
        set -o pipefail
        for i in $(ip -o link show | awk -F': ' '{print $2}' | grep -E '^(cali|vxlan\.calico|tunl0)' | cut -d@ -f1); do
          ip link delete "$i" 2>/dev/null || true
        done
      args:
        executable: /bin/bash
      changed_when: true

    - name: Restart containerd after reset
      ansible.builtin.systemd:
        name: containerd
        state: restarted
